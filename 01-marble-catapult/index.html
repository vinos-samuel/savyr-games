  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    height: 100vh;
    background: #1b2a3a;
    font-family: 'Baloo 2', sans-serif;
  }
  canvas {
    border: 6px solid #3a2a1a;
    border-radius: 10px;
    background: #bfe6f5;
    /* tell the browser not to scroll/zoom on touch here — otherwise a
       drag-to-aim gesture on a phone gets hijacked as a page scroll */
    touch-action: none;
  }
  .shop {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: linear-gradient(180deg, #2c4062, #1e2f4a);
    border: 2px solid #3a2a1a;
    border-radius: 12px;
    padding: 12px 20px;
    color: #f4ede0;
    font-size: 17px;
    width: 620px;
    box-sizing: border-box;
    box-shadow: 0 6px 14px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .shop-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }
  .marble-count {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .marble-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: inline-block;
    background: radial-gradient(circle at 35% 30%, #ff9a8f, #e04a3f 55%, #8c2a20 100%);
    box-shadow: 0 2px 3px rgba(0,0,0,0.4);
  }
  .marble-icon.shiny {
    box-shadow: 0 2px 3px rgba(0,0,0,0.4), 0 0 6px 1px rgba(255,215,0,0.85);
  }
  .shop button {
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    padding: 9px 18px;
    border-radius: 9px;
    border: none;
    background: linear-gradient(180deg, #5eea94, #34c274);
    color: #123020;
    box-shadow: 0 3px 0 #1f8a4c, 0 4px 8px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  .shop button:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #1f8a4c, 0 2px 4px rgba(0,0,0,0.3);
  }
  .shop button:disabled {
    background: #5a6474;
    color: #9aa3b0;
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }
  #crateBtn {
    background: linear-gradient(180deg, #cfa8ff, #9b6bef);
    color: #2a1550;
    box-shadow: 0 3px 0 #6b3fc2, 0 4px 8px rgba(0,0,0,0.3);
  }
  #crateBtn:active {
    box-shadow: 0 1px 0 #6b3fc2, 0 2px 4px rgba(0,0,0,0.3);
  }
  #mergeBtn {
    background: linear-gradient(180deg, #ffe28a, #ffa726);
    color: #4a2a00;
    box-shadow: 0 3px 0 #b8791a, 0 4px 8px rgba(0,0,0,0.3);
    font-size: 13px;
    padding: 7px 14px;
  }
  #mergeBtn:active { box-shadow: 0 1px 0 #b8791a, 0 2px 4px rgba(0,0,0,0.3); }
  #steadyBtn {
    background: linear-gradient(180deg, #7ec8f7, #3b9fe0);
    color: #0a2a40;
    box-shadow: 0 3px 0 #2a6fa3, 0 4px 8px rgba(0,0,0,0.3);
    font-size: 13px;
    padding: 7px 14px;
  }
  #steadyBtn:active { box-shadow: 0 1px 0 #2a6fa3, 0 2px 4px rgba(0,0,0,0.3); }
  .power-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 14px;
  }
  .arena-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0.92;
  }
  .arena-bar {
    flex: 1;
    height: 10px;
    background: #101a2c;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .arena-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffe28a, #ffa726);
    transition: width 0.4s ease;
  }
  .trail-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff8a3d, #e0433a);
    transition: width 0.4s ease;
  }
  .crate-reveal {
    font-size: 15px;
    min-height: 18px;
    text-align: center;
    color: #ffd76a;
  }
  .swatch-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    min-height: 26px;
  }
  .swatch-label {
    font-size: 13px;
    opacity: 0.8;
    margin-right: 2px;
  }
  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid rgba(255,255,255,0.25);
    box-sizing: border-box;
    transition: transform 0.1s ease;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.active {
    border-color: #ffffff;
    box-shadow: 0 0 0 2px #123020;
  }
  .swatch.shiny {
    border-color: #ffd700;
    box-shadow: 0 0 6px 1px rgba(255,215,0,0.85);
  }
  .swatch.shiny.active {
    box-shadow: 0 0 6px 1px rgba(255,215,0,0.85), 0 0 0 2px #123020;
  }
</style>
</head>
<body>

<canvas id="game" width="800" height="450"></canvas>

<div class="shop">
  <div class="shop-row">
    <span class="marble-count"><span class="marble-icon" id="marbleIcon"></span><span id="marbleCount">Colors: 0/13</span></span>
    <button id="crateBtn">Open Marble Crate — $25</button>
  </div>
  <div class="power-row">
    <span>⚡ Power Marbles: <span id="powerCount">0</span></span>
    <button id="mergeBtn">Merge 2 Marbles</button>
    <button id="steadyBtn">Steady Aim — $40</button>
  </div>
  <div class="arena-row">
    <span>🏆 Champion's Arena</span>
    <div class="arena-bar"><div class="arena-fill" id="arenaFill"></div></div>
    <span id="arenaText">$0 / $500</span>
  </div>
  <div class="arena-row">
    <span>🔥 Fire Trail</span>
    <div class="arena-bar"><div class="trail-fill" id="trailFill"></div></div>
    <span id="trailText">$0 / $1000</span>
  </div>
  <div class="swatch-row" id="swatchRow"><span class="swatch-label">Wear:</span></div>
  <div class="crate-reveal" id="crateReveal"></div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const groundY = 380;

const LEVEL_SKIES = [
  { top: "#bfe6f5", bottom: "#e9f7ec", buildings: "#93a6c2", windows: "rgba(255,255,255,0.55)" }, // level 1: clear day
  { top: "#f7c98a", bottom: "#f2a15a", buildings: "#6b5a73", windows: "rgba(255,235,180,0.85)" }, // level 2: sunset
  { top: "#1b2a4a", bottom: "#33406b", buildings: "#141b30", windows: "rgba(255,221,120,0.9)" }   // level 3: night
];

// the city skyline behind the court — generated once with a fixed pattern
// (not Math.random) so it doesn't flicker or reshuffle every frame
const BUILDINGS = [];
(function generateSkyline() {
  let x = -12;
  let i = 0;
  // a small gap between buildings so each one's extruded side/roof face
  // (drawn further right/up) has room to actually show, instead of being
  // covered by the next building's front face
  const gap = 9;
  while (x < canvas.width) {
    const w = 45 + (i % 4) * 15;
    const h = 70 + ((i * 37) % 110);
    BUILDINGS.push({ x, w, h });
    x += w + gap;
    i++;
  }
})();

// where the slingshot sits
const slingX = 120;
const slingForkY = groundY - 100; // where the two prongs meet the trunk
const prongLeftX = slingX - 26;
const prongRightX = slingX + 26;
const prongTipY = groundY - 165;

// resting spot for the marble when nobody's pulling it back
const restX = slingX;
const restY = prongTipY + 25;
const marbleRadius = 16;
let marbleColor = "#e04a3f"; // starting red — crates reveal new colors to wear

// how far back the marble can be pulled, and how that turns into speed
const MAX_PULL = 100;
const POWER = 12.5;
const GRAVITY = 1400;

// the basketball hoop, over on the right — bigger and bolder so it's easy to read.
// position and forgiveness change with the level (see applyDifficulty below)
const BASE_HOOP_X = 690;
const BASE_HOOP_TOP_Y = 130;
const BASE_HOOP_HIT_RADIUS = 24;
let hoopPoleX = BASE_HOOP_X;
let hoopPoleTopY = BASE_HOOP_TOP_Y;
let hoopHitRadius = BASE_HOOP_HIT_RADIUS;
const backboardW = 16;
const backboardH = 78;
let rimX = hoopPoleX - 62; // rim sticks out toward the shooter
let rimY = hoopPoleTopY + 66;
const rimRadiusX = 32;
const rimRadiusY = 10;

function backboardSquareRect() {
  return { x: hoopPoleX - 7, y: hoopPoleTopY + 22, w: 14, h: 16 };
}

// the backboard's front face — the vertical line a ball can bank off of
function backboardFaceX() {
  return hoopPoleX - backboardW / 2;
}

// each level, the hoop gets a little further/higher and a little less
// forgiving. Capped at 6 levels' worth of extra difficulty (checked with a
// simulation so every level still has a real, reachable pull — not razor's
// edge, and never mathematically impossible)
function applyDifficulty() {
  const extra = Math.min(levelNum - 1, 6);
  hoopPoleX = BASE_HOOP_X + extra * 18;
  hoopPoleTopY = BASE_HOOP_TOP_Y - extra * 7;
  hoopHitRadius = Math.max(BASE_HOOP_HIT_RADIUS - extra * 1.2, 15);
  rimX = hoopPoleX - 62;
  rimY = hoopPoleTopY + 66;
}

// ---- game state ----
let marbleX = restX;
let marbleY = restY;
let mode = "aiming";      // "aiming" | "flying" | "result"
let vx = 0, vy = 0;        // the launch velocity a shot started with
let flightVx = 0, flightVy = 0; // current velocity, changes as gravity pulls it down
let launchX = 0, launchY = 0;   // where the marble actually was when released
let simClockLast = null;
let liveTrail = [];        // dots for the shot currently in the air
let ghostTrail = [];        // last miss, kept faint on screen so you can correct
let message = "";

// ---- marble "juice": squash/stretch, spin, and confetti ----
let squashPulse = 0;   // 0..1, spikes on impact then decays — the "thump"
let marbleRotation = 0; // spins while rolling/flying, so motion reads clearly
let particles = [];

function updateMarbleJuice(dt) {
  squashPulse = Math.max(0, squashPulse - dt * 4);
  if (mode === "flying") {
    marbleRotation += (flightVx / marbleRadius) * dt;
  }
}

function spawnConfetti(x, y) {
  const colors = ["#ff7a1a", "#4ade80", "#f0ac4d", "#ffffff", "#e04a3f"];
  for (let i = 0; i < 16; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 80 + Math.random() * 160;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 60,
      life: 1,
      color: colors[i % colors.length],
      size: 3 + Math.random() * 3
    });
  }
}

// a cosmetic ember trail behind the marble in flight, unlocked at
// TRAIL_GOAL lifetime earnings — small, short-lived so it reads as sparks
// falling away rather than a full burst
function spawnTrailSpark(x, y) {
  const colors = ["#ff9d3d", "#ff5a36", "#ffd166"];
  particles.push({
    x, y,
    vx: (Math.random() - 0.5) * 40,
    vy: (Math.random() - 0.5) * 40,
    life: 0.4,
    color: colors[Math.floor(Math.random() * colors.length)],
    size: 2 + Math.random() * 2.5
  });
}

// a distinct electric-yellow burst so a Power Marble push feels like it
// actually did something, separate from the confetti a score gets
function spawnPowerBurst(x, y) {
  const colors = ["#ffe066", "#fff4b8", "#ffd700"];
  for (let i = 0; i < 14; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 120 + Math.random() * 200;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      color: colors[i % colors.length],
      size: 2.5 + Math.random() * 3
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += 500 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt * 1.1;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach((p) => {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
}

function drawMarbleShadow() {
  const heightAboveGround = Math.max(0, groundY - marbleY);
  const t = Math.max(0, 1 - heightAboveGround / 220);
  if (t <= 0) return;
  const shadowW = marbleRadius * 2 * (0.6 + 0.4 * t);
  const shadowH = shadowW * 0.28;
  ctx.beginPath();
  ctx.ellipse(marbleX, groundY - 2, shadowW / 2, shadowH / 2, 0, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(20,20,20,${(0.28 * t).toFixed(2)})`;
  ctx.fill();
}

// ---- rounds & levels ----
const ROUNDS_PER_LEVEL = 5;
let levelNum = 1;
let roundNum = 1;
let hasScored = false;   // did the current shot already go through the hoop?
let gloveShovedThisShot = false; // used a Power Marble already this shot?
let hasBackboardBounced = false; // only one backboard bank per shot
let bounceCount = 0;
const MAX_BOUNCES = 2;
const BOUNCE_DAMPING = 0.45;

function roundLabel() {
  if (roundNum === ROUNDS_PER_LEVEL) return `Level ${levelNum} — BOSS ROUND`;
  return `Level ${levelNum} — Round ${roundNum} of ${ROUNDS_PER_LEVEL}`;
}

// ---- money ----
// first hit of a level pays $10, then doubles each hit after that;
// a miss doesn't take money away, it just resets the payout for the retry
let totalMoney = 0;      // spendable wallet — crates cost from this
let nextPayout = 10;
let displayedMoney = 0;   // ticks up toward totalMoney instead of snapping
let lifetimeEarnings = 0; // never goes down, even when you spend — the
                          // "save toward one big thing" progress meter

// ---- marble shop: crates are the collect-and-reveal mechanic ----
// shooting is always free and unlimited — crates are purely cosmetic,
// no color is more powerful than another
const CRATE_PRICE = 25;
const MARBLE_COLORS = [
  // common
  { name: "Green",  hex: "#4ade80", weight: 15 },
  { name: "Blue",   hex: "#3b82f6", weight: 15 },
  { name: "Purple", hex: "#a78bfa", weight: 15 },
  { name: "Pink",   hex: "#f472b6", weight: 15 },
  { name: "Red",    hex: "#ef4444", weight: 15 },
  { name: "Yellow", hex: "#fbbf24", weight: 15 },
  { name: "Lime",   hex: "#a3e635", weight: 15 },
  // rare
  { name: "Cyan",    hex: "#38bdf8", weight: 9 },
  { name: "Orange",  hex: "#fb923c", weight: 9 },
  { name: "Teal",    hex: "#2dd4bf", weight: 9 },
  { name: "Magenta", hex: "#e879f9", weight: 9 },
  // legendary
  { name: "Gold",   hex: "#ffd700", weight: 4 },
  { name: "Silver", hex: "#9ca3af", weight: 4 }
];
// how many of each color you've collected — duplicates are what you merge
let colorCounts = {};
// every color name ever obtained, kept even after merging its duplicates
// away to 0 — this is what "owned" means for the swatch row and the count
let discoveredColors = new Set();

// ---- shiny variants: same 7 colors, a rare foil version for bragging rights ----
const SHINY_CHANCE = 0.01; // 1-in-100 per crate
let discoveredShinyColors = new Set(); // color names found in shiny form at least once
let marbleIsShiny = false; // is the currently-equipped marble the shiny version?

// ---- merging: 2 duplicates of any color become 1 Power Marble ----
// for now there's just one power: during the boss round, a Power Marble
// automatically shoves the glove aside instead of letting it block you
let poweredMarbleCount = 0;

// ---- steady aim: pay for a shot that can't miss the hoop ----
// overrides whatever you pulled with a real arc computed straight from
// wherever you released to the rim — still flies and can still get
// blocked by the boss glove, it just can't miss the hoop itself
const STEADY_AIM_PRICE = 40;
let steadyAimActive = false;

function guaranteedShotFrom(x0, y0) {
  const dx = rimX - x0;
  const dy = rimY - y0;
  const dist = Math.hypot(dx, dy);
  const t = Math.max(0.55, Math.min(1.3, dist / 700));
  return {
    vx: dx / t,
    vy: (dy - 0.5 * GRAVITY * t * t) / t
  };
}

// ---- champion's arena: the big saved-up unlock ----
const ARENA_GOAL = 500;
let arenaUnlocked = false;

// ---- fire trail: a cosmetic spark trail behind the marble in flight,
// unlocked once you've earned even more than the arena took ----
const TRAIL_GOAL = 1000;
let trailUnlocked = false;

const marbleCountEl = document.getElementById("marbleCount");
const marbleIconEl = document.getElementById("marbleIcon");
const crateBtn = document.getElementById("crateBtn");
const mergeBtn = document.getElementById("mergeBtn");
const steadyBtn = document.getElementById("steadyBtn");
const powerCountEl = document.getElementById("powerCount");
const arenaFillEl = document.getElementById("arenaFill");
const arenaTextEl = document.getElementById("arenaText");
const trailFillEl = document.getElementById("trailFill");
const trailTextEl = document.getElementById("trailText");
const crateRevealEl = document.getElementById("crateReveal");
const swatchRowEl = document.getElementById("swatchRow");

function pickRandomColor() {
  const totalWeight = MARBLE_COLORS.reduce((sum, c) => sum + c.weight, 0);
  let r = Math.random() * totalWeight;
  for (const c of MARBLE_COLORS) {
    if (r < c.weight) return c;
    r -= c.weight;
  }
  return MARBLE_COLORS[0];
}

function hasAnyMergeablePair() {
  return Object.values(colorCounts).some((count) => count >= 2);
}

// the crate's job is done once every color has been found and every
// duplicate that ever came from one has been merged into a Power Marble —
// nothing left for a crate to give you at that point
function collectionComplete() {
  return discoveredColors.size === MARBLE_COLORS.length && !hasAnyMergeablePair();
}

// the one place marbleColor changes — keeps the ball, the shop icon, and
// the swatch row all in sync no matter who triggers the change
function equipColor(hex, isShiny = false) {
  marbleColor = hex;
  marbleIsShiny = isShiny;
  marbleIconEl.style.background = `radial-gradient(circle at 35% 30%, #fff, ${hex} 55%, #000 100%)`;
  marbleIconEl.classList.toggle("shiny", isShiny);
  renderSwatches();
}

function renderSwatches() {
  swatchRowEl.querySelectorAll(".swatch").forEach((el) => el.remove());
  Array.from(discoveredColors).forEach((name) => {
    const c = MARBLE_COLORS.find((mc) => mc.name === name);
    if (!c) return;
    const el = document.createElement("div");
    const isActive = marbleColor === c.hex && !marbleIsShiny;
    el.className = "swatch" + (isActive ? " active" : "");
    el.style.background = `radial-gradient(circle at 35% 30%, #fff, ${c.hex} 55%, #000 100%)`;
    el.title = name;
    el.addEventListener("click", () => {
      equipColor(c.hex, false);
      saveGame();
    });
    swatchRowEl.appendChild(el);
  });
  // shiny variants get their own swatch, right after the normal one —
  // same color, gold ring, so it reads as "the fancy version of this one"
  Array.from(discoveredShinyColors).forEach((name) => {
    const c = MARBLE_COLORS.find((mc) => mc.name === name);
    if (!c) return;
    const el = document.createElement("div");
    const isActive = marbleColor === c.hex && marbleIsShiny;
    el.className = "swatch shiny" + (isActive ? " active" : "");
    el.style.background = `radial-gradient(circle at 35% 30%, #fff, ${c.hex} 55%, #000 100%)`;
    el.title = `Shiny ${name}`;
    el.addEventListener("click", () => {
      equipColor(c.hex, true);
      saveGame();
    });
    swatchRowEl.appendChild(el);
  });
}

function updateShopUI() {
  const colorsOwned = discoveredColors.size;
  marbleCountEl.textContent = `Colors: ${colorsOwned}/${MARBLE_COLORS.length}`;
  crateBtn.disabled = totalMoney < CRATE_PRICE || collectionComplete();
  crateBtn.title = collectionComplete() ? "All marbles collected and merged!" : "";
  mergeBtn.disabled = !hasAnyMergeablePair();
  mergeBtn.title = hasAnyMergeablePair() ? "" : "Collect 2 of the same color from crates first";
  steadyBtn.disabled = steadyAimActive || totalMoney < STEADY_AIM_PRICE;
  steadyBtn.textContent = steadyAimActive ? "Steady Aim: ON" : `Steady Aim — $${STEADY_AIM_PRICE}`;
  powerCountEl.textContent = poweredMarbleCount;
  renderSwatches();

  const pct = Math.min(100, (lifetimeEarnings / ARENA_GOAL) * 100);
  arenaFillEl.style.width = pct + "%";
  arenaTextEl.textContent = arenaUnlocked ? "Unlocked! 🏆" : `$${lifetimeEarnings} / $${ARENA_GOAL}`;

  const trailPct = Math.min(100, (lifetimeEarnings / TRAIL_GOAL) * 100);
  trailFillEl.style.width = trailPct + "%";
  trailTextEl.textContent = trailUnlocked ? "Unlocked! 🔥" : `$${lifetimeEarnings} / $${TRAIL_GOAL}`;
}

let crateRevealTimer = null;

function flashReveal(text) {
  crateRevealEl.textContent = text;
  clearTimeout(crateRevealTimer);
  crateRevealTimer = setTimeout(() => { crateRevealEl.textContent = ""; }, 2200);
}

function openCrate() {
  if (totalMoney < CRATE_PRICE || collectionComplete()) return;
  totalMoney -= CRATE_PRICE;
  const picked = pickRandomColor();
  const isNew = !discoveredColors.has(picked.name);
  const isShiny = Math.random() < SHINY_CHANCE;
  const isNewShiny = isShiny && !discoveredShinyColors.has(picked.name);
  colorCounts[picked.name] = (colorCounts[picked.name] || 0) + 1;
  discoveredColors.add(picked.name);
  if (isShiny) discoveredShinyColors.add(picked.name);

  let text;
  if (isNewShiny) text = `🌟 SHINY ${picked.name}! So rare!`;
  else if (isShiny) text = `🌟 Shiny ${picked.name} again!`;
  else if (isNew) text = `✨ New color: ${picked.name}!`;
  else text = `Got ${picked.name} again`;
  flashReveal(text);
  updateShopUI();
  saveGame();
}

function mergeMarbles() {
  const colorToMerge = Object.keys(colorCounts).find((name) => colorCounts[name] >= 2);
  if (!colorToMerge) return;
  colorCounts[colorToMerge] -= 2;
  if (colorCounts[colorToMerge] === 0) delete colorCounts[colorToMerge];
  poweredMarbleCount++;
  flashReveal(`⚡ Merged 2 ${colorToMerge} into a Power Marble!`);
  updateShopUI();
  saveGame();
}

function buySteadyAim() {
  if (steadyAimActive || totalMoney < STEADY_AIM_PRICE) return;
  totalMoney -= STEADY_AIM_PRICE;
  steadyAimActive = true;
  flashReveal("🎯 Steady Aim ready for your next shot!");
  updateShopUI();
  saveGame();
}

crateBtn.addEventListener("click", openCrate);
mergeBtn.addEventListener("click", mergeMarbles);
steadyBtn.addEventListener("click", buySteadyAim);

function checkArenaUnlock() {
  if (!arenaUnlocked && lifetimeEarnings >= ARENA_GOAL) {
    arenaUnlocked = true;
  }
  if (!trailUnlocked && lifetimeEarnings >= TRAIL_GOAL) {
    trailUnlocked = true;
  }
}

// ---- boss round: boxing glove(s) punch out to guard the hoop ----
// each glove cycles retracted (safe) -> winding (telegraph) -> punching
// (danger!) -> [rewind -> punching again, on higher levels] -> retracting -> loop
const GLOVE_RADIUS = 20;
const BASE_GLOVE_CYCLE = { retracted: 1.1, winding: 0.35, punching: 0.5, retracting: 0.3 };
const REWIND_PAUSE = 0.25; // brief gap between the two punches of a double-punch cycle
let gloves = []; // built fresh by ensureGloves() whenever the boss round's glove count changes
let lastDrawTime = null;

function isBossRound() {
  return roundNum === ROUNDS_PER_LEVEL;
}

// tier ramps up what the boss round throws at you: levels 1-3 a single
// punch, 4-6 a glove that punches twice per cycle, 7+ two gloves at once
function bossTier() {
  if (levelNum <= 3) return 1;
  if (levelNum <= 6) return 2;
  return 3;
}

function punchesPerCycle() {
  return bossTier() >= 2 ? 2 : 1;
}

function gloveCount() {
  return bossTier() >= 3 ? 2 : 1;
}

// higher levels punch more often and hold the danger window open longer —
// same capped ramp as the hoop difficulty, so it never gets impossible
function gloveCycle() {
  const extra = Math.min(levelNum - 1, 6);
  return {
    retracted: Math.max(BASE_GLOVE_CYCLE.retracted - extra * 0.08, 0.6),
    winding: Math.max(BASE_GLOVE_CYCLE.winding - extra * 0.02, 0.22),
    punching: Math.min(BASE_GLOVE_CYCLE.punching + extra * 0.05, 0.8),
    retracting: BASE_GLOVE_CYCLE.retracting
  };
}

function gloveRetractedPos(index) {
  // tucked up by the backboard; a second glove tucks in lower so both are
  // visible at rest instead of sitting on top of each other
  const base = { x: hoopPoleX + 20, y: hoopPoleTopY + 14 };
  return index === 1 ? { x: base.x, y: base.y + 34 } : base;
}

function glovePunchPos(index) {
  // the second glove punches to a spot just below the rim, guarding a
  // wider area instead of just doubling up on the same point
  return index === 1 ? { x: rimX, y: rimY + 22 } : { x: rimX, y: rimY };
}

function ensureGloves() {
  const count = gloveCount();
  if (gloves.length === count) return;
  gloves = [];
  for (let i = 0; i < count; i++) {
    gloves.push({
      state: "retracted",
      // stagger the second glove's clock so the two don't punch in lockstep
      timer: i === 0 ? 0 : gloveCycle().retracted / 2
    });
  }
}

function updateGlove(dt) {
  if (!isBossRound()) {
    gloves = [];
    return;
  }
  ensureGloves();
  const cycle = gloveCycle();
  gloves.forEach((g) => {
    g.timer += dt;
    if (g.state === "retracted" && g.timer >= cycle.retracted) {
      g.timer = 0; g.state = "winding"; g.punchesLeft = punchesPerCycle();
    } else if (g.state === "winding" && g.timer >= cycle.winding) {
      g.timer = 0; g.state = "punching";
    } else if (g.state === "punching" && g.timer >= cycle.punching) {
      g.timer = 0;
      g.punchesLeft--;
      g.state = g.punchesLeft > 0 ? "rewind" : "retracting";
    } else if (g.state === "rewind" && g.timer >= REWIND_PAUSE) {
      g.timer = 0; g.state = "punching";
    } else if (g.state === "retracting" && g.timer >= cycle.retracting) {
      g.timer = 0; g.state = "retracted";
    }
  });
}

function gloveCenterFor(g, index) {
  const retractedPos = gloveRetractedPos(index);
  const punchPos = glovePunchPos(index);
  if (g.state === "winding" || g.state === "rewind") {
    // a little shake so a kid can see the punch coming, whether it's
    // winding up from rest or pulling back for a second jab
    const shake = Math.sin(g.timer * 40) * 3;
    const from = g.state === "rewind" ? punchPos : retractedPos;
    return { x: from.x + shake, y: from.y };
  }
  if (g.state === "punching") return punchPos;
  if (g.state === "retracting") {
    const t = g.timer / gloveCycle().retracting;
    return { x: punchPos.x + (retractedPos.x - punchPos.x) * t, y: punchPos.y + (retractedPos.y - punchPos.y) * t };
  }
  return retractedPos;
}

// centers of every glove currently mid-punch — only the punch itself can
// actually block a shot, everything else is safe
function dangerousGloveCenters() {
  if (!isBossRound()) return [];
  return gloves
    .map((g, i) => (g.state === "punching" ? gloveCenterFor(g, i) : null))
    .filter(Boolean);
}

// ---- saving progress, so a refresh doesn't wipe everything out ----
const SAVE_KEY = "marbleCatapultSave";

function saveGame() {
  const data = {
    levelNum, roundNum, totalMoney, nextPayout, lifetimeEarnings, arenaUnlocked, trailUnlocked,
    marbleColor, marbleIsShiny, colorCounts, poweredMarbleCount,
    discoveredColors: Array.from(discoveredColors),
    discoveredShinyColors: Array.from(discoveredShinyColors)
  };
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (e) {
    // storage might be unavailable (e.g. private browsing) — just skip saving
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    levelNum = data.levelNum ?? levelNum;
    roundNum = data.roundNum ?? roundNum;
    totalMoney = data.totalMoney ?? totalMoney;
    nextPayout = data.nextPayout ?? nextPayout;
    lifetimeEarnings = data.lifetimeEarnings ?? lifetimeEarnings;
    arenaUnlocked = data.arenaUnlocked ?? arenaUnlocked;
    trailUnlocked = data.trailUnlocked ?? trailUnlocked;
    marbleColor = data.marbleColor ?? marbleColor;
    marbleIsShiny = data.marbleIsShiny ?? marbleIsShiny;
    colorCounts = data.colorCounts ?? colorCounts;
    poweredMarbleCount = data.poweredMarbleCount ?? poweredMarbleCount;
    // older saves predate discoveredColors — fall back to whatever's still
    // in colorCounts so those players don't lose their collected swatches
    discoveredColors = new Set(data.discoveredColors ?? Object.keys(colorCounts));
    discoveredShinyColors = new Set(data.discoveredShinyColors ?? []);
    displayedMoney = totalMoney; // don't animate in a big jump right on load
  } catch (e) {
    // a corrupted save shouldn't crash the game — just start fresh
  }
}

loadGame();
applyDifficulty();
updateShopUI();
marbleIconEl.style.background = `radial-gradient(circle at 35% 30%, #fff, ${marbleColor} 55%, #000 100%)`;
marbleIconEl.classList.toggle("shiny", marbleIsShiny);

// ---- sound: a clap for a hit, a descending "dun dun dun" for a miss ----
// both built from oscillators/noise, no sound files needed
let audioCtx = null;

function tone(freq, startOffset, duration, type) {
  const t0 = audioCtx.currentTime + startOffset;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.18, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration);
}

// a clap is a short burst of noise, not a musical note — build it from
// random samples instead of an oscillator
function clap(startOffset) {
  const t0 = audioCtx.currentTime + startOffset;
  const duration = 0.12;
  const sampleCount = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, sampleCount, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < sampleCount; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / sampleCount);
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = 1500;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.5, t0);
  gain.gain.exponentialRampToValueAtTime(0.01, t0 + duration);
  noise.connect(filter).connect(gain).connect(audioCtx.destination);
  noise.start(t0);
}

function playHitSound() {
  // a little round of applause: a few claps close together
  [0, 0.09, 0.16, 0.24, 0.34].forEach((offset) => clap(offset));
}
function playMissSound() {
  [220, 175, 130].forEach((f, i) => tone(f, i * 0.24, 0.35, "sawtooth"));
}

// ---- drawing ----
function currentSky() {
  return LEVEL_SKIES[(levelNum - 1) % LEVEL_SKIES.length];
}

function drawSky() {
  const sky = currentSky();
  const gradient = ctx.createLinearGradient(0, 0, 0, groundY);
  gradient.addColorStop(0, sky.top);
  gradient.addColorStop(1, sky.bottom);
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// lighten (positive) or darken (negative) a #rrggbb color, for cheap shading
function shadeColor(hex, percent) {
  const num = parseInt(hex.replace("#", ""), 16);
  let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
  if (percent < 0) {
    r *= 1 + percent; g *= 1 + percent; b *= 1 + percent;
  } else {
    r += (255 - r) * percent; g += (255 - g) * percent; b += (255 - b) * percent;
  }
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

// depth offset for the extruded side/roof faces — a cheap way to make flat
// rectangles read as 3D blocks, like a light isometric illustration
const BUILDING_DEPTH_X = 7;
const BUILDING_DEPTH_Y = -9;

function drawCitySkyline() {
  const sky = currentSky();
  const roofColor = shadeColor(sky.buildings, -0.18);
  const sideColor = shadeColor(sky.buildings, -0.4);

  BUILDINGS.forEach((b) => {
    const topY = groundY - b.h;

    // roof face
    ctx.beginPath();
    ctx.moveTo(b.x, topY);
    ctx.lineTo(b.x + BUILDING_DEPTH_X, topY + BUILDING_DEPTH_Y);
    ctx.lineTo(b.x + b.w + BUILDING_DEPTH_X, topY + BUILDING_DEPTH_Y);
    ctx.lineTo(b.x + b.w, topY);
    ctx.closePath();
    ctx.fillStyle = roofColor;
    ctx.fill();

    // side face
    ctx.beginPath();
    ctx.moveTo(b.x + b.w, topY);
    ctx.lineTo(b.x + b.w + BUILDING_DEPTH_X, topY + BUILDING_DEPTH_Y);
    ctx.lineTo(b.x + b.w + BUILDING_DEPTH_X, groundY + BUILDING_DEPTH_Y);
    ctx.lineTo(b.x + b.w, groundY);
    ctx.closePath();
    ctx.fillStyle = sideColor;
    ctx.fill();

    // front face
    ctx.fillStyle = sky.buildings;
    ctx.fillRect(b.x, topY, b.w, b.h);
  });

  // windows — a deterministic scatter, not a redraw-every-frame random one —
  // only on the front face
  ctx.fillStyle = sky.windows;
  BUILDINGS.forEach((b, bi) => {
    for (let row = 0; row * 16 < b.h - 10; row++) {
      for (let col = 0; col * 14 < b.w - 10; col++) {
        if ((bi + row * 3 + col * 2) % 3 === 0) {
          ctx.fillRect(b.x + 6 + col * 14, groundY - b.h + 8 + row * 16, 5, 7);
        }
      }
    }
  });
}

function drawGround() {
  // the court surface — gold once Champion's Arena is unlocked, the big
  // permanent flex for saving up $500 in lifetime earnings
  ctx.fillStyle = arenaUnlocked ? "#caa23a" : "#c9793f";
  ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
  ctx.fillStyle = arenaUnlocked ? "#e8c563" : "#d68f57";
  ctx.fillRect(0, groundY, canvas.width, 5);

  // the painted key/paint area under the hoop, and a free-throw arc,
  // simplified for this side-on view
  ctx.strokeStyle = arenaUnlocked ? "rgba(255,247,214,0.9)" : "rgba(244,237,224,0.85)";
  ctx.lineWidth = 3;
  ctx.strokeRect(hoopPoleX - 110, groundY, 110, 5 + 22);
  ctx.beginPath();
  ctx.arc(hoopPoleX - 110, groundY + 13, 22, Math.PI * 0.5, Math.PI * 1.5);
  ctx.stroke();
}

function drawSlingshot() {
  ctx.strokeStyle = "#7a4a2a";
  ctx.lineWidth = 12;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(slingX, groundY);
  ctx.lineTo(slingX, slingForkY);
  ctx.stroke();

  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(slingX, slingForkY);
  ctx.lineTo(prongLeftX, prongTipY);
  ctx.moveTo(slingX, slingForkY);
  ctx.lineTo(prongRightX, prongTipY);
  ctx.stroke();

  // band is drawn AFTER the marble in draw(), so it looks like it's holding the marble
}

function drawBand(toX, toY) {
  ctx.strokeStyle = "#4a2f18";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(prongLeftX, prongTipY);
  ctx.lineTo(toX, toY);
  ctx.lineTo(prongRightX, prongTipY);
  ctx.stroke();
}

function drawMarble() {
  const speed = Math.hypot(flightVx, flightVy);
  const travelAngle = Math.atan2(flightVy, flightVx);
  const stretchAmt = mode === "flying" ? Math.min(speed / 2600, 0.35) : 0;
  const bounceAmt = squashPulse * 0.4;

  ctx.save();
  ctx.translate(marbleX, marbleY);
  // squash/stretch along the direction of travel — rotate to that axis,
  // scale, then rotate back so the sphere itself stays upright on screen
  ctx.rotate(travelAngle);
  ctx.scale(1 + stretchAmt + bounceAmt, 1 - stretchAmt * 0.6 - bounceAmt);
  ctx.rotate(-travelAngle);

  // highlight/shadow are computed from the marble's actual color, not
  // hardcoded — otherwise every color but the original red looks muddy
  const grad = ctx.createRadialGradient(
    -marbleRadius * 0.35, -marbleRadius * 0.4, marbleRadius * 0.15,
    0, 0, marbleRadius * 1.15
  );
  grad.addColorStop(0, shadeColor(marbleColor, 0.7));
  grad.addColorStop(0.5, marbleColor);
  grad.addColorStop(1, shadeColor(marbleColor, -0.55));
  ctx.beginPath();
  ctx.arc(0, 0, marbleRadius, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // shiny marbles get a sweeping foil streak across the surface, like
  // holographic trading-card foil catching the light as it turns
  if (marbleIsShiny) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, marbleRadius, 0, Math.PI * 2);
    ctx.clip();
    ctx.rotate((performance.now() / 500) % (Math.PI * 2));
    const shimmer = ctx.createLinearGradient(-marbleRadius, 0, marbleRadius, 0);
    shimmer.addColorStop(0, "rgba(255,255,255,0)");
    shimmer.addColorStop(0.5, "rgba(255,255,255,0.6)");
    shimmer.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = shimmer;
    ctx.fillRect(-marbleRadius, -marbleRadius, marbleRadius * 2, marbleRadius * 2);
    ctx.restore();
  }

  // a small mark that spins with the ball, so rolling actually reads as rolling
  ctx.rotate(marbleRotation);
  ctx.beginPath();
  ctx.arc(marbleRadius * 0.5, 0, 3, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fill();

  ctx.restore();
}

function drawHoop() {
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.25)";
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 6;

  ctx.strokeStyle = "#8a8a8a";
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(hoopPoleX, groundY);
  ctx.lineTo(hoopPoleX, hoopPoleTopY);
  ctx.stroke();

  const backboardGrad = ctx.createLinearGradient(0, hoopPoleTopY, 0, hoopPoleTopY + backboardH);
  backboardGrad.addColorStop(0, "#ffffff");
  backboardGrad.addColorStop(1, "#d7d7d7");
  ctx.fillStyle = backboardGrad;
  ctx.strokeStyle = "#333333";
  ctx.lineWidth = 2.5;
  ctx.fillRect(hoopPoleX - backboardW / 2, hoopPoleTopY, backboardW, backboardH);
  ctx.strokeRect(hoopPoleX - backboardW / 2, hoopPoleTopY, backboardW, backboardH);
  ctx.restore();

  // the red shooting-square real backboards have. It's a solid, opaque
  // painted rectangle now (was just a hollow outline before)
  const sq = backboardSquareRect();
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(sq.x, sq.y, sq.w, sq.h);
  ctx.strokeStyle = "#e04a3f";
  ctx.lineWidth = 2;
  ctx.strokeRect(sq.x, sq.y, sq.w, sq.h);

  // net
  ctx.strokeStyle = "#f4f4f4";
  ctx.lineWidth = 2;
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath();
    ctx.moveTo(rimX + i * (rimRadiusX / 3.2), rimY + 2);
    ctx.lineTo(rimX + i * (rimRadiusX / 6), rimY + 30);
    ctx.stroke();
  }

  // rim — a gradient stroke gives it a rounded, tube-like shine
  const rimGrad = ctx.createLinearGradient(0, rimY - rimRadiusY, 0, rimY + rimRadiusY);
  rimGrad.addColorStop(0, "#ffb15c");
  rimGrad.addColorStop(0.55, "#ff7a1a");
  rimGrad.addColorStop(1, "#c95c0f");
  ctx.strokeStyle = rimGrad;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.ellipse(rimX, rimY, rimRadiusX, rimRadiusY, 0, 0, Math.PI * 2);
  ctx.stroke();

  // while Steady Aim is armed, a pulsing halo on the rim itself — this is
  // where the next shot is locked to land, no matter how you pull
  if (steadyAimActive) {
    const pulse = 0.75 + Math.sin(performance.now() / 180) * 0.25;
    ctx.strokeStyle = `rgba(126,200,247,${pulse.toFixed(2)})`;
    ctx.lineWidth = 3;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.ellipse(rimX, rimY, rimRadiusX * 1.25, rimRadiusY * 1.25, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawGloves() {
  gloves.forEach((glove, i) => drawGlove(gloveCenterFor(glove, i)));
}

function drawGlove(g) {
  // it punches out from the backboard side, so the wrist/cuff sits to the
  // right and the rounded fist faces left, toward the shooter
  const cuffGrad = ctx.createLinearGradient(g.x + 8, g.y - 11, g.x + 8, g.y + 11);
  cuffGrad.addColorStop(0, "#ffffff");
  cuffGrad.addColorStop(1, "#c7c7c7");
  ctx.fillStyle = cuffGrad;
  ctx.strokeStyle = "#b8b8b8";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(g.x + 8, g.y - 11, 22, 22, 5);
  ctx.fill();
  ctx.stroke();

  const mittGrad = ctx.createRadialGradient(g.x - 10, g.y - 10, 4, g.x - 3, g.y, 26);
  mittGrad.addColorStop(0, "#ec6f6f");
  mittGrad.addColorStop(0.6, "#d64545");
  mittGrad.addColorStop(1, "#9c2f26");
  ctx.fillStyle = mittGrad;
  ctx.strokeStyle = "#7a1f18";
  ctx.lineWidth = 2.5;

  // thumb, tucked behind the main mitt
  ctx.beginPath();
  ctx.ellipse(g.x - 12, g.y - 12, 8, 7, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // the main mitt
  ctx.beginPath();
  ctx.ellipse(g.x - 3, g.y, 23, 18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // knuckle seams for a bit of texture
  ctx.strokeStyle = "rgba(122,31,24,0.6)";
  ctx.lineWidth = 1.5;
  [-6, 2, 10].forEach((dx) => {
    ctx.beginPath();
    ctx.moveTo(g.x - 3 + dx, g.y - 12);
    ctx.lineTo(g.x - 3 + dx, g.y + 12);
    ctx.stroke();
  });
}

function drawTrail(points, color) {
  ctx.fillStyle = color;
  points.forEach((p) => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  });
}

// how far along the "pop in" animation the current message is, 0 to 1
let messageTimer = 0;
let lastMessage = "";

function easeOutBack(t) {
  const c = 1.70158;
  return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
}

function drawMessage() {
  if (!message) { lastMessage = ""; return; }
  if (message !== lastMessage) {
    lastMessage = message;
    messageTimer = 0;
  }
  const scale = easeOutBack(Math.min(messageTimer, 1));

  ctx.save();
  ctx.translate(canvas.width / 2, 70);
  ctx.scale(scale, scale);
  ctx.font = message.length > 16 ? "bold 26px 'Baloo 2', sans-serif" : "bold 34px 'Baloo 2', sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = message.includes("SWISH") ? "#1f8a4c" : "#c2402c";
  ctx.fillText(message, 0, 0);
  ctx.restore();
}

function drawHUD() {
  ctx.font = "bold 20px 'Baloo 2', sans-serif";
  ctx.textAlign = "left";
  const label = (arenaUnlocked ? "🏆 " : "") + roundLabel();
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillText(label, 22, 36);
  ctx.fillStyle = roundNum === ROUNDS_PER_LEVEL ? "#ffdd55" : "#ffffff";
  ctx.fillText(label, 20, 34);

  const moneyText = `$${Math.round(displayedMoney)}`;
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillText(moneyText, canvas.width - 18, 36);
  ctx.fillStyle = "#4ade80";
  ctx.fillText(moneyText, canvas.width - 20, 34);
}

// simulate the arc a shot from (startX,startY) with this vx/vy would take, as a row of dots
function computeTrail(startX, startY, startVx, startVy) {
  const points = [];
  for (let t = 0; t < 3; t += 0.05) {
    const x = startX + startVx * t;
    const y = startY + startVy * t + 0.5 * GRAVITY * t * t;
    if (y > groundY || x > canvas.width) break;
    points.push({ x, y });
  }
  return points;
}

function draw(now) {
  if (lastDrawTime === null) lastDrawTime = now;
  const animDt = Math.min((now - lastDrawTime) / 1000, 0.05);
  lastDrawTime = now;
  updateGlove(animDt);
  if (message) messageTimer += animDt;
  displayedMoney += (totalMoney - displayedMoney) * Math.min(animDt * 6, 1);
  if (Math.abs(totalMoney - displayedMoney) < 0.5) displayedMoney = totalMoney;
  updateParticles(animDt);
  updateMarbleJuice(animDt);

  drawSky();
  drawCitySkyline();
  drawGround();
  drawHoop();
  if (isBossRound()) drawGloves();
  drawMarbleShadow();
  drawTrail(ghostTrail, "rgba(120,120,120,0.35)");
  if (mode === "aiming" && liveTrail.length) {
    drawTrail(liveTrail, "rgba(224,74,63,0.5)");
  }
  drawSlingshot();
  // the band always shows — holding the marble while aiming, or snapped
  // back empty while the marble's away in the air
  if (mode === "aiming") {
    drawBand(marbleX, marbleY);
  } else {
    drawBand(restX, restY);
  }
  drawMarble();
  drawParticles();
  drawHUD();
  drawMessage();
  requestAnimationFrame(draw);
}

// how close a line segment gets to the hoop's center — this way a fast
// shot can't "tunnel" past the rim between two animation frames
function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx * dx + dy * dy;
  let t = lenSq === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const nearX = x1 + t * dx;
  const nearY = y1 + t * dy;
  return Math.hypot(px - nearX, py - nearY);
}

// ---- physics for an actual shot in flight ----
// Uses a clamped delta-time step (not "time since launch") so a slow or
// throttled frame can't make the marble jump huge distances in one step.
function stepFlight(now) {
  if (simClockLast === null) simClockLast = now;
  const dt = Math.min((now - simClockLast) / 1000, 0.033);
  simClockLast = now;

  const prevX = marbleX;
  const prevY = marbleY;
  marbleX += flightVx * dt;
  marbleY += flightVy * dt + 0.5 * GRAVITY * dt * dt;
  flightVy += GRAVITY * dt;

  if (trailUnlocked) spawnTrailSpark(prevX, prevY);

  // only check for a score before it's already gone in — once it's scored,
  // let it keep falling through and bounce, don't "unscore" it
  if (!hasScored) {
    if (!gloveShovedThisShot) {
      const blockingGlove = dangerousGloveCenters().find(
        (g) => distToSegment(g.x, g.y, prevX, prevY, marbleX, marbleY) < GLOVE_RADIUS + marbleRadius * 0.6
      );
      if (blockingGlove) {
        if (poweredMarbleCount > 0) {
          // a Power Marble shoves every glove aside for this shot — it keeps flying
          poweredMarbleCount--;
          gloveShovedThisShot = true;
          message = "⚡ PUSHED BACK!";
          spawnPowerBurst(blockingGlove.x, blockingGlove.y);
          squashPulse = 1;
          updateShopUI();
        } else {
          finishShot(false, true);
          return;
        }
      }
    }
    const passedNearHoop = distToSegment(rimX, rimY, prevX, prevY, marbleX, marbleY) < hoopHitRadius;
    if (flightVy > 0 && passedNearHoop) {
      hasScored = true;
      flightVx *= 0.25; // the net drags on it, like a real one would
      message = "SWISH! 🎉";
      playHitSound();
      squashPulse = 0.7;
      spawnConfetti(rimX, rimY);
    }
  }

  // a shot with too much power sails past the rim and can bank off the
  // backboard — reflects sideways, like the ground bounce but vertical.
  // Whether that bank happens to drop it in the hoop or knocks it away
  // depends entirely on the angle/power it arrived with.
  // Uses a segment crossing test (not "is the current point inside the
  // box") so a fast ball can't tunnel past it between two frames — the
  // same class of fix the rim/glove already needed. The catch zone is
  // also taller than the drawn backboard so it's reachable at normal
  // overpowered angles, not just a narrow sliver.
  if (!hasScored && !hasBackboardBounced && prevX < backboardFaceX() && marbleX >= backboardFaceX()) {
    const faceX = backboardFaceX();
    const crossT = (faceX - prevX) / (marbleX - prevX);
    const crossY = prevY + (marbleY - prevY) * crossT;
    const zoneTop = hoopPoleTopY - 40;
    const zoneBottom = groundY;
    if (crossY >= zoneTop && crossY <= zoneBottom) {
      marbleX = faceX - marbleRadius;
      marbleY = crossY;
      flightVx = -flightVx * 0.5;
      hasBackboardBounced = true;
      squashPulse = 0.8;
    }
  }

  const onGround = marbleY > groundY - marbleRadius;
  if (onGround) {
    if (hasScored && bounceCount < MAX_BOUNCES) {
      marbleY = groundY - marbleRadius;
      flightVy = -flightVy * BOUNCE_DAMPING;
      flightVx *= 0.6;
      bounceCount++;
      squashPulse = 1;
    } else {
      finishShot(hasScored);
      return;
    }
  } else if (marbleX > canvas.width + 40) {
    finishShot(hasScored);
    return;
  }
  requestAnimationFrame(stepFlight);
}

function finishShot(hit, blocked) {
  mode = "result";
  const usedSteadyAim = steadyAimActive;
  if (steadyAimActive) {
    steadyAimActive = false; // one shot only, used regardless of outcome
  }
  if (hit) {
    ghostTrail = [];
    totalMoney += nextPayout;
    lifetimeEarnings += nextPayout;
    checkArenaUnlock();
    nextPayout *= 2;
    updateShopUI();
    roundNum++;
    message = gloveShovedThisShot ? "⚡ POWER SAVE — SWISH! 🎉"
      : usedSteadyAim ? "🎯 STEADY AIM — SWISH! 🎉"
      : "SWISH! 🎉";
    if (roundNum > ROUNDS_PER_LEVEL) {
      roundNum = 1;
      levelNum++;
      nextPayout = 10;
      applyDifficulty();
    }
  } else {
    ghostTrail = computeTrail(launchX, launchY, vx, vy);
    playMissSound();
    if (blocked) {
      // the glove only slows you down — always just try the boss round again
      message = "BLOCKED! 🥊 — try again";
    } else {
      // missing never costs you the round — boss included, you just retry it
      message = "MISS — try again";
    }
  }
  updateShopUI();
  saveGame();
  setTimeout(() => {
    message = "";
    marbleX = restX;
    marbleY = restY;
    flightVx = 0;
    flightVy = 0;
    marbleRotation = 0;
    liveTrail = [];
    hasScored = false;
    gloveShovedThisShot = false;
    hasBackboardBounced = false;
    bounceCount = 0;
    mode = "aiming";
  }, 1300);
}

// ---- input: drag the marble back like a real slingshot ----
function getPointerPos(evt) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const point = evt.touches ? evt.touches[0] : evt;
  return {
    x: (point.clientX - rect.left) * scaleX,
    y: (point.clientY - rect.top) * scaleY
  };
}

let dragging = false;

function onDown(evt) {
  if (mode !== "aiming") return;
  const p = getPointerPos(evt);
  if (Math.hypot(p.x - marbleX, p.y - marbleY) < marbleRadius * 3) {
    dragging = true;
    // stop the page from scrolling/panning once we know this touch is
    // actually grabbing the marble, not just tapping somewhere on the page
    if (evt.cancelable) evt.preventDefault();
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function onMove(evt) {
  if (!dragging) return;
  if (evt.cancelable) evt.preventDefault();
  const p = getPointerPos(evt);
  const dx = p.x - restX;
  const dy = p.y - restY;
  const dist = Math.min(Math.hypot(dx, dy), MAX_PULL);
  const angle = Math.atan2(dy, dx);
  marbleX = restX + Math.cos(angle) * dist;
  marbleY = restY + Math.sin(angle) * dist;

  const launchVx = (restX - marbleX) * POWER;
  const launchVy = (restY - marbleY) * POWER;
  liveTrail = computeTrail(marbleX, marbleY, launchVx, launchVy);
}

function onUp(evt) {
  if (!dragging) return;
  if (evt && evt.cancelable) evt.preventDefault();
  dragging = false;
  if (steadyAimActive) {
    const guided = guaranteedShotFrom(marbleX, marbleY);
    vx = guided.vx;
    vy = guided.vy;
  } else {
    vx = (restX - marbleX) * POWER;
    vy = (restY - marbleY) * POWER;
  }
  flightVx = vx;
  flightVy = vy;
  launchX = marbleX;
  launchY = marbleY;
  liveTrail = [];
  mode = "flying";
  simClockLast = null;
  requestAnimationFrame(stepFlight);
}

canvas.addEventListener("mousedown", onDown);
canvas.addEventListener("mousemove", onMove);
window.addEventListener("mouseup", onUp);
// { passive: false } is required here — browsers default touch listeners
// to passive (can't preventDefault) for scroll performance, which would
// otherwise silently let the page scroll instead of dragging the marble
canvas.addEventListener("touchstart", onDown, { passive: false });
canvas.addEventListener("touchmove", onMove, { passive: false });
window.addEventListener("touchend", onUp, { passive: false });

requestAnimationFrame(draw);
</script>

</body>
</html>
